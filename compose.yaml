name: heart-rate-monitor

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env to an existing local PostgreSQL image}
    pull_policy: never
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heart_rate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-heart_rate_monitor}
      PGDATA: /var/lib/postgresql/project-data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
