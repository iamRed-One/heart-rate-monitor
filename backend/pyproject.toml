[project]
name = "heart-rate-monitor-api"
version = "0.1.0"
description = "FastAPI backend for the Wearable Heart-Rate Data Viewer"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "email-validator>=2,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ruff==0.14.0",
]
